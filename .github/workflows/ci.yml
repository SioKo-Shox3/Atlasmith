name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run python -c "import sys; print(sys.version)"
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      # WHY マーカー除外: 上の `uv sync --locked` は extras 無し(= torch/sam2/moderngl
      # は入らない)で走り、GitHub Actions ランナーは CUDA GPU も GL コンテキストも
      # 持たない。`gl`/`ml` のテストは能力検出で skip されるが、除外を明示して
      # 「CI で何を検証していないか」をワークフロー側にも残す(計画v4 §2.7)。
      - run: uv run pytest -m "not ml and not gl"
